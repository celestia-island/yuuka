name: Deploy Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      # lagrange's dev branch is gone (dev branches were retired workspace-wide),
      # which broke every `--branch dev` install. crates.io first (published
      # 0.2.9 == git master), with a git-master fallback pinned to the live branch.
      - run: cargo install lagrange-library --locked || cargo install --git https://github.com/celestia-island/lagrange --branch master lagrange-library
      - run: lagrange build --src docs --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
