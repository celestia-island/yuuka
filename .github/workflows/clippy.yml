name: Clippy

# One in-flight run per ref: a superseded push cancels its
# predecessor instead of queueing behind it (farm-pressure
# relief, AGENTS ci-ops 8.3.3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/clippy.yml'
      - 'src/**/*'
      - 'macros/**/*'
      - 'tests/**/*'
      - 'Cargo.toml'
  push:
    branches: [master]

jobs:
  clippy:
    name: Clippy
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: |
          cargo clippy \
            --all-targets \
            --all-features \
            -- -D warnings
