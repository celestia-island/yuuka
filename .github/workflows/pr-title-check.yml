name: PR Title Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Dispatch-only per the 2026-11-06 trigger policy: CI no longer runs on pull
  # requests. Format is held by review plus the squash subject; the lane stays
  # dispatchable so a patch can still be checked on demand.
  workflow_dispatch:
jobs:
  pr-title-check:
    uses: celestia-island/celestia-devtools/.github/workflows/pr-title-check.yml@c45f1881e00cb55d0a2a1fcf57b28734ece119bb
    with:
      devtools-ref: c45f1881e00cb55d0a2a1fcf57b28734ece119bb
