name: Test

# One in-flight run per ref: a superseded push cancels its
# predecessor instead of queueing behind it (farm-pressure
# relief, AGENTS ci-ops 8.3.3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'src/**/*'
      - 'macros/**/*'
      - 'tests/**/*'
      - 'Cargo.toml'
  push:
    branches: [master]

jobs:
  test:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Test
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Run unit test
        run: |
          cargo test \
            --all-targets \
            --all-features \
            --no-fail-fast

      - name: Run across crate example test
        run: |
          cargo run \
          --manifest-path \
          ./tests/across_crate_entry/Cargo.toml
