name: Test

# One in-flight run per ref: a superseded push cancels its
# predecessor instead of queueing behind it (farm-pressure
# relief, AGENTS ci-ops 8.3.3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # One leg on purpose: the suite runs once, on stable. The nightly
        # toolchain keeps the static checks (clippy.yml, fmt.yml) but does
        # not re-run the suite — the farm has 4-6 slots and a second run
        # of the same tree only doubles that queue.
        toolchain:
          - stable

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Run unit test
        run: |
          cargo test \
            --all-targets \
            --all-features \
            --no-fail-fast

      - name: Run across crate example test
        run: |
          cargo run \
          --manifest-path \
          ./tests/across_crate_entry/Cargo.toml
