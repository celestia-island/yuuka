[workspace]
resolver = "2"
members = ["macros"]
exclude = ["tests/across_crate_entry", "tests/across_crate_lib"]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.75"
authors = ["langyo <langyo.china@gmail.com>"]
license = "SySL-1.0"
repository = "https://github.com/celestia-island/yuuka"

[package]
name = "yuuka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Nested structure derivation macro for Rust"
license.workspace = true
repository.workspace = true
keywords = ["proc-macro", "derive", "nested", "macro", "struct"]
categories = ["rust-patterns"]
publish = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
yuuka-macros = { path = "macros", version = "0.9.0" }

[dev-dependencies]
anyhow = "^1"
